version: '3.8'

services:
  postgis-db:
    image: postgis/postgis:16-3.4
    container_name: postgis-land-governance
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: land_governance
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d land_governance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
